<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#0e0e10">
<title>LF2 Twitch Lite</title>
<style>
:root{
  --bg:#0e0e10;--panel:#18181b;--panel2:#202024;--line:#34343b;
  --text:#efeff1;--muted:#adadb8;--accent:#9147ff;--accent2:#772ce8;
  --danger:#6a3038;--ok:#41a55c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans JP",sans-serif}
body{padding:22px}
.shell{max-width:1180px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
h1{font-size:40px;margin:0 0 5px} h1 span{font-size:15px;color:var(--muted);font-weight:normal}
.topbar p{margin:0;color:var(--muted);font-size:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
h2{font-size:25px;margin:0}
.count{display:inline-flex;min-width:38px;height:38px;align-items:center;justify-content:center;border-radius:999px;background:var(--panel2);color:var(--muted)}
input,button{font:inherit}
input{width:100%;min-height:66px;border-radius:12px;border:2px solid #47474f;background:#101014;color:white;padding:0 16px;font-size:24px}
button{border:0;border-radius:12px;color:white;cursor:pointer}
button:focus,input:focus{outline:5px solid #fff;outline-offset:3px}
.primary{background:var(--accent);font-size:22px;font-weight:700;min-height:66px;padding:0 20px}
.primary:hover{background:var(--accent2)}
.ghost{background:#2b2b31;color:#ddd}.small{min-height:46px;padding:0 15px;font-size:16px}
.addRow,.openRow{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:12px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;grid-template-columns:minmax(0,1fr) 74px;gap:9px}
.watch{min-height:78px;text-align:left;padding:0 20px;background:#26262c;font-size:25px;font-weight:700}
.watch:hover{background:#303038}.remove{min-height:78px;background:var(--danger);font-size:28px}.star{background:#3a3251}
.empty{color:var(--muted);border:1px dashed #414149;border-radius:12px;padding:18px;margin-bottom:14px}
.status{margin-top:14px;min-height:28px;color:#bf94ff;font-size:18px}.status.error{color:#ff8c99}.status.ok{color:#7bd88f}
.help{color:#d5d5da;line-height:1.65}.help p{margin:8px 0}.kbd{display:inline-block;background:#29292f;border:1px solid #45454d;border-radius:6px;padding:2px 7px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tools button{min-height:50px;padding:0 16px;background:#303036;font-size:16px}
.fileInput{display:none}
@media(max-width:850px){body{padding:14px}h1{font-size:31px}.topbar{align-items:flex-start}.addRow,.openRow,.cards{grid-template-columns:1fr}.card{grid-template-columns:minmax(0,1fr) 70px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div>
      <h1>LF2 Twitch Lite <span>v0.3</span></h1>
      <p>Panasonic TH-43LF2Y 向け軽量Twitchランチャー</p>
    </div>
    <button id="clearStatus" class="small ghost" type="button">状態を消す</button>
  </header>

  <section class="panel">
    <div class="sectionHead">
      <h2>お気に入り</h2>
      <span id="favoriteCount" class="count">0</span>
    </div>
    <div id="favoritesEmpty" class="empty">まだお気に入りはありません。下から追加できます。</div>
    <div id="favorites" class="cards"></div>
    <div class="addRow" style="margin-top:16px">
      <input id="favoriteInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Twitchチャンネル名 または URL">
      <button id="addFavorite" class="primary" type="button">＋ お気に入りに追加</button>
    </div>
  </section>

  <section class="panel">
    <h2 style="margin-bottom:15px">チャンネルを開く</h2>
    <div class="openRow">
      <input id="channelInput" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="例: streamer_name / https://twitch.tv/streamer_name">
      <button id="openLite" class="primary" type="button">▶ 軽量プレイヤーで開く</button>
    </div>
    <div id="status" class="status">待機中</div>
  </section>

  <section class="panel">
    <div class="sectionHead">
      <h2>最近見たチャンネル</h2>
      <button id="clearRecent" class="small ghost" type="button">履歴を消去</button>
    </div>
    <div id="recentEmpty" class="empty">まだ履歴はありません。</div>
    <div id="recent" class="cards"></div>
  </section>

  <section class="panel help">
    <h2 style="margin-bottom:12px">設定・バックアップ</h2>
    <p>お気に入りと履歴はテレビのブラウザ内に保存されます。Twitch動画自体はPCを経由しません。</p>
    <div class="tools">
      <button id="exportData" type="button">設定を書き出す</button>
      <button id="importData" type="button">設定を読み込む</button>
      <input id="importFile" class="fileInput" type="file" accept="application/json,.json">
    </div>
  </section>

  <section class="panel help">
    <h2 style="margin-bottom:12px">使い方</h2>
    <p>配信者を選ぶと、重いTwitch公式サイト全体ではなく <strong>player.twitch.tv</strong> を直接開きます。</p>
    <p><span class="kbd">戻る</span> でこのランチャーへ戻れます。</p>
  </section>
</main>
<script>
(function(){
'use strict';
var FAVORITES='lf2TwitchLite.favorites.v1';
var RECENT='lf2TwitchLite.recent.v1';
var MAX_RECENT=10;
var favoritesEl=document.getElementById('favorites');
var recentEl=document.getElementById('recent');
var favoritesEmpty=document.getElementById('favoritesEmpty');
var recentEmpty=document.getElementById('recentEmpty');
var favoriteCount=document.getElementById('favoriteCount');
var favoriteInput=document.getElementById('favoriteInput');
var channelInput=document.getElementById('channelInput');
var statusEl=document.getElementById('status');

function load(key){try{var v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function save(key,v){try{localStorage.setItem(key,JSON.stringify(v));return true}catch(e){setStatus('保存に失敗しました: '+e.message,'error');return false}}
function normalize(v){v=(v||'').trim();var m=v.match(/^(?:https?:\/\/)?(?:www\.)?twitch\.tv\/([A-Za-z0-9_]{2,40})(?:[\/?#].*)?$/i);if(m)v=m[1];return /^[A-Za-z0-9_]{2,40}$/.test(v)?v.toLowerCase():''}
function playerUrl(c){return 'https://player.twitch.tv/?channel='+encodeURIComponent(c)+'&parent=twitch.tv&player=popout&autoplay=true&muted=false'}
function setStatus(t,kind){statusEl.textContent=t;statusEl.className='status'+(kind?' '+kind:'')}
function addRecent(c){var r=load(RECENT).filter(function(x){return x!==c});r.unshift(c);save(RECENT,r.slice(0,MAX_RECENT))}
function openChannel(v){var c=normalize(v);if(!c){setStatus('チャンネル名を確認してください。','error');return}addRecent(c);render();setStatus(c+' を開いています…','ok');location.href=playerUrl(c)}
function addFavorite(v){var c=normalize(v);if(!c){setStatus('お気に入りに追加するチャンネル名を確認してください。','error');return}var f=load(FAVORITES);if(f.indexOf(c)!==-1){setStatus(c+' はすでにお気に入りです。');return}f.push(c);f.sort();if(save(FAVORITES,f)){favoriteInput.value='';setStatus(c+' をお気に入りに追加しました。','ok');render()}}
function removeFavorite(c){save(FAVORITES,load(FAVORITES).filter(function(x){return x!==c}));setStatus(c+' をお気に入りから削除しました。');render()}
function makeCard(c,isFavorite){var row=document.createElement('div');row.className='card';var watch=document.createElement('button');watch.type='button';watch.className='watch';watch.textContent='▶  '+c;watch.onclick=function(){openChannel(c)};var second=document.createElement('button');second.type='button';second.className=isFavorite?'remove':'remove star';second.textContent=isFavorite?'×':'☆';second.onclick=isFavorite?function(){removeFavorite(c)}:function(){addFavorite(c)};row.appendChild(watch);row.appendChild(second);return row}
function renderFavorites(){var f=load(FAVORITES);favoritesEl.innerHTML='';favoriteCount.textContent=String(f.length);favoritesEmpty.style.display=f.length?'none':'block';f.forEach(function(c){favoritesEl.appendChild(makeCard(c,true))})}
function renderRecent(){var r=load(RECENT),f=load(FAVORITES);recentEl.innerHTML='';recentEmpty.style.display=r.length?'none':'block';r.forEach(function(c){var row=makeCard(c,false);if(f.indexOf(c)!==-1){row.children[1].textContent='★';row.children[1].onclick=function(){setStatus(c+' はお気に入り登録済みです。')}}recentEl.appendChild(row)})}
function render(){renderFavorites();renderRecent()}

document.getElementById('addFavorite').onclick=function(){addFavorite(favoriteInput.value)};
document.getElementById('openLite').onclick=function(){openChannel(channelInput.value)};
document.getElementById('clearRecent').onclick=function(){save(RECENT,[]);setStatus('履歴を消去しました。');render()};
document.getElementById('clearStatus').onclick=function(){setStatus('待機中')};
favoriteInput.addEventListener('keydown',function(e){if(e.key==='Enter')addFavorite(favoriteInput.value)});
channelInput.addEventListener('keydown',function(e){if(e.key==='Enter')openChannel(channelInput.value)});

document.getElementById('exportData').onclick=function(){
  var data={version:1,favorites:load(FAVORITES),recent:load(RECENT)};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='lf2-twitch-lite-settings.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1000);
};
document.getElementById('importData').onclick=function(){document.getElementById('importFile').click()};
document.getElementById('importFile').onchange=function(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var d=JSON.parse(reader.result);if(!d||!Array.isArray(d.favorites)||!Array.isArray(d.recent))throw new Error('形式が違います');save(FAVORITES,d.favorites.map(normalize).filter(Boolean));save(RECENT,d.recent.map(normalize).filter(Boolean).slice(0,MAX_RECENT));setStatus('設定を読み込みました。','ok');render()}catch(err){setStatus('読み込み失敗: '+err.message,'error')}};reader.readAsText(file)};
render();
})();
</script>
</body>
</html>
